# base_url : URL du proxy OAuth GitHub, à compléter une fois déployé sur Cloudflare Workers.
backend:
  name: github
  repo: felixlephenix/rugby-entpe
  branch: main
  base_url: https://TODO.workers.dev
  auth_endpoint: /auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "actus"
    label: "Actualités"
    folder: "src/content/actus"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "titre", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Résumé", name: "resume", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "matchs"
    label: "Calendrier"
    folder: "src/content/matchs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.adversaire}}"
    fields:
      - { label: "Adversaire", name: "adversaire", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Lieu", name: "lieu", widget: "string" }
      - { label: "À domicile", name: "domicile", widget: "boolean", default: true }
      - label: "Catégorie"
        name: "categorie"
        widget: "select"
        options: ["Séniors", "Féminines", "Loisir"]
      - { label: "Score équipe", name: "scoreEquipe", widget: "number", required: false }
      - { label: "Score adversaire", name: "scoreAdversaire", widget: "number", required: false }
